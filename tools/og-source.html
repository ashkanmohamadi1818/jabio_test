<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:Bebas;src:url(../assets/fonts/BebasNeue-400.woff2)}
@font-face{font-family:Pop;font-weight:500;src:url(../assets/fonts/Poppins-500.woff2)}
html,body{margin:0}
.c{width:1200px;height:630px;background:#000;position:relative;overflow:hidden;font-family:Pop,sans-serif;color:#fff}
.g{position:absolute;inset:0;background:radial-gradient(600px 400px at 85% 15%,rgba(124,124,224,.45),transparent 70%),radial-gradient(520px 380px at 10% 95%,rgba(172,247,240,.25),transparent 70%)}
.grid{position:absolute;inset:0;opacity:.18;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:60px 60px;mask-image:linear-gradient(120deg,transparent 30%,#000 90%)}
.logo{position:absolute;left:80px;top:44px;display:flex;align-items:center;gap:18px;font:400 44px Bebas;letter-spacing:2px}
.pin{display:flex;align-items:center}
h1{position:absolute;left:80px;top:230px;margin:0;font:400 128px/0.98 Bebas;letter-spacing:2px}
h1 span{display:block}h1 span+span{background:linear-gradient(69.72deg,#D9F2C7,#C2C3F5 54%,#ACF7F0);-webkit-background-clip:text;color:transparent}
p{position:absolute;left:80px;bottom:70px;margin:0;font-size:28px;color:#BBBBBD}
</style>
<div class="c"><div class="g"></div><div class="grid"></div>
<div class="logo"><div class="pin"><img src="../assets/logo.png" style="height:150px;filter:drop-shadow(0 0 2px rgba(255,255,255,.8))"></div></div>
<h1><span>RIGHT BUSINESS.</span><span>RIGHT PLACE.</span></h1>
<p>Location intelligence for Iranian businesses, built on open data.</p></div>
